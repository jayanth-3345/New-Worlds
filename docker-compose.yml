services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: new-worlds-backend
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: new-worlds-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend